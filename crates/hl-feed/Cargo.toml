[package]
name = "hl-feed"
description = "Real-time Hyperliquid market-data feed over the public WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }

[dev-dependencies]
# The live smoke test needs a rustls crypto provider installed, which is the
# binary's job in real use; the test stands in for that here.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true
